<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enes Büyükdeniz Oyunları</title>
<style>
:root { --bg: #fff8ec; --ink: #3a2418; --soft: #7a5d4a; --red: #c8412b; --line: #e2cfb0; color-scheme: light; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 640px; margin: 0 auto; padding: 40px max(18px, env(safe-area-inset-right, 0px)) 48px max(18px, env(safe-area-inset-left, 0px)); }
h1 { color: var(--red); font-size: 28px; line-height: 1.2; margin: 0 0 8px; }
.game { margin-top: 24px; border: 2px solid var(--line); border-radius: 16px; padding: 16px 18px; background: #fff; }
.game h2 { margin: 0 0 4px; font-size: 20px; }
.game p { margin: 0 0 10px; color: var(--soft); }
.game a { color: var(--red); font-weight: 700; margin-right: 14px; }
</style>
</head>
<body>
<main>
<h1>Enes Büyükdeniz Oyunları</h1>
<p>Bağımsız mobil oyunlar.</p>
<div class="game">
  <h2>Çay Ocağı</h2>
  <p>Dedenden kalan çay ocağını ayakta tut: çayı kıvamında demle, müdavimlerini hatırla.</p>
  <a href="/cay-ocagi/">Tarayıcıda oyna</a>
  <a href="/cay-ocagi/privacy.html">Gizlilik politikası</a>
</div>
</main>
</body>
</html>
